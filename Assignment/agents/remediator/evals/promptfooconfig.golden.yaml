# S4 remediator, golden provider, no API key

description: S4 Remediator (golden)

prompts:
  - file://../prompt/Prompt.md

providers:
  - id: file://providers/goldenProvider.cjs
    label: Golden Output (offline)

defaultTest:
  options:
    provider: golden
  assert:
    - type: javascript
      value: file://assertions/remediator.cjs:assertFixesApplied
      metric: fixes_applied
      threshold: 1.0
    - type: javascript
      value: file://assertions/remediator.cjs:assertNoForbiddenPatterns
      metric: forbidden_patterns
      threshold: 1.0
    - type: javascript
      value: file://assertions/remediator.cjs:assertStructuralContract
      metric: structural_contract
      threshold: 1.0

tests:
  - file://tests/01-missing-trycatch.yaml
  - file://tests/02-missing-xact-abort.yaml
  - file://tests/03-direct-queue-insert.yaml
  - file://tests/04-hardcoded-columns.yaml
  - file://tests/05-ungated-catch.yaml
  - file://tests/06-missing-nocount.yaml
  - file://tests/07-missing-prep-sp.yaml
  - file://tests/08-missing-error-logging.yaml

evaluateOptions:
  maxConcurrency: 4
