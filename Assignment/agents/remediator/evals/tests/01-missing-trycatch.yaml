description: "Wrap enqueue in TRY/CATCH with error logging"
vars:
  scenario: missing-trycatch
  expected_resolved_elements: '["BEGIN TRY / BEGIN CATCH", "ToGpmq_LogTriggerError OR inline NAF.BaseLog insert in CATCH", "IF XACT_STATE() = -1 rethrow pattern"]'
  review_json: |
    {
      "verdict": "FAIL",
      "structure_checklist": {
        "passed": ["SET NOCOUNT ON", "SET XACT_ABORT OFF", "Command detection block (inserted/deleted → RI/RU/RD)", "Dynamic column discovery (no hard-coded business column names like scm_id, cm_id in static SELECT lists)"],
        "failed": [],
        "missing": ["BEGIN TRY / BEGIN CATCH", "ToGpmq_LogTriggerError OR inline NAF.BaseLog insert in CATCH", "IF XACT_STATE() = -1 rethrow pattern"]
      },
      "violations": [{"id": "V1", "severity": "critical", "detail": "Enqueue not wrapped in TRY/CATCH", "fix": "Wrap prep SP + sp_executesql in BEGIN TRY; add CATCH with ToGpmq_LogTriggerError and IF XACT_STATE() = -1 THROW"}]
    }
  trigger_sql: |
    CREATE OR ALTER TRIGGER [PurinaNA].[BatchCampaign_DownstreamMigration]
    ON [PurinaNA].[BatchCampaign]
    AFTER INSERT, UPDATE, DELETE
    AS
    BEGIN
        SET NOCOUNT ON;
        SET XACT_ABORT OFF;
        DECLARE @Command VARCHAR(2);
        IF EXISTS (SELECT 1 FROM inserted) AND EXISTS (SELECT 1 FROM deleted)
            SET @Command = 'RU';
        ELSE IF EXISTS (SELECT 1 FROM inserted)
            SET @Command = 'RI';
        ELSE IF EXISTS (SELECT 1 FROM deleted)
            SET @Command = 'RD';
        ELSE RETURN;
        DECLARE @Schema SYSNAME = N'PurinaNA';
        DECLARE @Table SYSNAME = N'BatchCampaign';
        DECLARE @Sql NVARCHAR(MAX);
        EXEC [PurinaNA].[ToGpmq_EnqueueRecordByTriggerPrep]
            @Schema = @Schema, @TableName = @Table, @Command = @Command, @Sql = @Sql OUTPUT;
        EXEC sp_executesql @Sql, N'@TableName SYSNAME, @Command VARCHAR(2)',
            @TableName = @Table, @Command = @Command;
    END
  golden_remediated_sql: |
    CREATE OR ALTER TRIGGER [PurinaNA].[BatchCampaign_DownstreamMigration]
    ON [PurinaNA].[BatchCampaign]
    AFTER INSERT, UPDATE, DELETE
    AS
    BEGIN
        SET NOCOUNT ON;
        SET XACT_ABORT OFF;
        DECLARE @Command VARCHAR(2);
        IF EXISTS (SELECT 1 FROM inserted) AND EXISTS (SELECT 1 FROM deleted)
            SET @Command = 'RU';
        ELSE IF EXISTS (SELECT 1 FROM inserted)
            SET @Command = 'RI';
        ELSE IF EXISTS (SELECT 1 FROM deleted)
            SET @Command = 'RD';
        ELSE RETURN;
        BEGIN TRY
            DECLARE @Schema SYSNAME = N'PurinaNA';
            DECLARE @Table SYSNAME = N'BatchCampaign';
            DECLARE @Sql NVARCHAR(MAX);
            EXEC [PurinaNA].[ToGpmq_EnqueueRecordByTriggerPrep]
                @Schema = @Schema, @TableName = @Table, @Command = @Command, @Sql = @Sql OUTPUT;
            EXEC sp_executesql @Sql, N'@TableName SYSNAME, @Command VARCHAR(2)',
                @TableName = @Table, @Command = @Command;
        END TRY
        BEGIN CATCH
            DECLARE @ErrNum INT = ERROR_NUMBER();
            DECLARE @ErrMsg NVARCHAR(4000) = ERROR_MESSAGE();
            DECLARE @ErrLine INT = ERROR_LINE();
            DECLARE @ErrProc NVARCHAR(200) = ERROR_PROCEDURE();
            EXEC [PurinaNA].[ToGpmq_LogTriggerError]
                @TriggerName = N'BatchCampaign_DownstreamMigration', @Command = @Command,
                @ErrNum = @ErrNum, @ErrMsg = @ErrMsg, @ErrLine = @ErrLine, @ErrProc = @ErrProc;
            IF XACT_STATE() = -1 THROW;
        END CATCH
    END
